<title>canvas action editor</title>
</head>
<body>
<table>
    <tr>
        <td>0</td>
        <td>3</td>
        <td>
            <select name="eights">
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
            </select>
        </td>
        <td>
            <select name="ones">
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
            </select>
        </td>
    </tr>
</table>    
        
<div id="maineditor" contenteditable="true" spellcheck="false"></div>

<canvas id = "main-canvas"></canvas>

<textarea id ="bytecode"></textarea>

<script>
address = 0o300;

hypercube = [];
for(let index = 0;index < 1024;index++){
    hypercube.push([]);
}


window.addEventListener('DOMContentLoaded', () => {
  const eightsSelect = document.querySelector('select[name="eights"]');
  const onesSelect = document.querySelector('select[name="ones"]');

  eightsSelect.value = "0";
  onesSelect.value = "0";

  function handleChange() {
    const eights = parseInt(eightsSelect.value);
    const ones = parseInt(onesSelect.value);
    
    address = 0o300 + (8 * eights) + ones;
        array = hypercube[address];
        code = "";
        for(let index = 0;index < array.length; index++){
            code += String.fromCharCode(array[index] - 512);
        }
        editor.setValue(code);
    
    console.log(`Address updated to octal: 0o${address.toString(8)}`);
  }

  eightsSelect.addEventListener('change', handleChange);
  onesSelect.addEventListener('change', handleChange);
});



editor = ace.edit("maineditor");
editor.setTheme("ace/theme/github");
//editor.setTheme("ace/theme/vibrant_ink");
editor.getSession().setMode("ace/mode/javascript");
editor.getSession().setUseWrapMode(true);
editor.$blockScrolling = Infinity;
editor.setTheme("ace/theme/vibrant_ink");
editor.setOption("useWorker", false);

load_file("canvas.json").then(
    filedata => {
        hypercube = JSON.parse(filedata);
        array = hypercube[address];
        code = "";
        for(let index = 0;index < array.length; index++){
            code += String.fromCharCode(array[index] - 512);
        }
        editor.setValue(code);
        
        mainGVM = new GVM();

        mainGVM.canvas.width = 200;
        mainGVM.canvas.height = 200;
        mainGVM.canvas.x0 = 0.5 * mainGVM.canvas.width; 
        mainGVM.canvas.y0 = 0.5 * mainGVM.canvas.height;
        mainGVM.canvas.unit = 0.3 * mainGVM.canvas.width; 
        mainGVM.style.line0 = 3;

        mainGVM.hypercube = hypercube;
        mainGVM.glyph = [0o336,0o332,0o337,0o341,0o340,0o333,0o340,0o341];
        drawGlyph(document.getElementById("main-canvas"), mainGVM);
    }
);


document.getElementById("bytecode").value = "";
document.getElementById("maineditor").onkeyup = function(){
    data = editor.getSession().getValue();
    bytecode = "0" + address.toString(8) + ":";
    array = [];
    for(let index = 0;index < data.length;index++){
        action = data.charCodeAt(index);
        
        symbol = action + 512;
        array.push(symbol);
        bytecode +=  "0" + symbol.toString(8) + ",";
    }
    bytecode = bytecode.replace(/,$/, '');
    document.getElementById("bytecode").value = bytecode;
    hypercube[address] = array;
    save_file("canvas.json",JSON.stringify(hypercube,null,2));
    
}



document.body.style.backgroundColor = "#ff0000af";
document.body.style.color = "white";
editor.setTheme("ace/theme/vibrant_ink");

class GVM {       //Geometron Virtual Machine
  constructor() {

    this.action = 0o177;
    this.address = 0o220;
    this.glyph = [];
    this.svgString = "";
    this.cursorStack = [];
    
    this.hypercube = [];
    for(let index = 0; index < 1024; index++){
        this.hypercube.push([0o177]);
    }


    this.canvas = {
        "width": 200,
        "height": 200,
        "unit": 100,
        "x0": 100,
        "y0": 100,
        "theta0": -Math.PI/2,
        "viewStep":50
    };
    this.cursor = {
        "x": 100,
        "y": 100,
        "r": 100,
        "word":"",
        "theta": -Math.PI/2,
        "thetaStep": Math.PI/2,
        "scaleFactor": 2,
        "font":"Arial",
        "bezier":{
            "cpx1":0,
            "cpy1":0,
            "cpx2":0,
            "cpy2":0,
            "x2":0,
            "y2":0
        }
    };
    this.style = {
        "color0": "black",
        "color1": "black",
        "color2": "red",
        "color3": "orange",
        "color4": "yellow",
        "color5": "green",
        "color6": "blue",
        "color7": "purple",
        "fill0": "black",
        "fill1": "black",
        "fill2": "red",
        "fill3": "orange",
        "fill4": "yellow",
        "fill5": "green",
        "fill6": "blue",
        "fill7": "purple",
        "line0": 2,
        "line1": 6,
        "line2": 2,
        "line3": 2,
        "line4": 2,
        "line5": 2,
        "line6": 2,
        "line7": 2
    };
    this.robot = {};
    this.vr = {};
    this.quantum = {};
    this.synth = {};
    this.keyboard = {
        "mode":0
    };
    this.mouse = {
        "x":0,
        "y":0,
        "z":0
    }
  }
}




function drawGlyph(canvas, gvm){

    gvm.cursor.x = gvm.canvas.x0;
    gvm.cursor.y = gvm.canvas.y0;
    gvm.cursor.r = gvm.canvas.unit;
    gvm.cursor.theta = gvm.canvas.theta0;
    gvm.cursor.scaleFactor = 2;
    gvm.cursor.thetaStep = Math.PI/2;
    gvm.svgString = "";
    gvm.cursor.word = "";
    gvm.cursorStack = [];
    
    gvm.svgString = "<svg width=\"" + gvm.canvas.width.toString() + "\" height=\"" + gvm.canvas.height.toString() + "\" viewbox = \"0 0 " + gvm.canvas.width.toString() + " " + gvm.canvas.height.toString() + "\"  xmlns=\"http://www.w3.org/2000/svg\">\n";
    gvm.svgString += "<!--<json></json>-->";
    ctx = canvas.getContext("2d");
    canvas.width = gvm.canvas.width;
    canvas.height = gvm.canvas.height;

    ctx.clearRect(0, 0, gvm.canvas.width, gvm.canvas.height);
    ctx.fillStyle = gvm.style.fill0 || "black";
    ctx.strokeStyle = gvm.style.color0 || "black";
    ctx.lineWidth = gvm.style.line0 || 2;     
    
    for(let index = 0; index < gvm.glyph.length; index++){
        geometronAction(ctx, gvm,gvm.glyph[index]);
    }
    
    gvm.svgString += "</svg>";    
}



function geometronAction(ctx, gvm,action){
    let x2, y2, localString, localInt, pathX2, pathY2; 
    if((action >= 0o200 && action <= 0o277) || (action >= 0o1000 && action <= 0o1777) || (action >= 0o500 && action <= 0o677)){
        for(let index = 0;index < gvm.hypercube[action].length;index++){
            geometronAction(ctx, gvm,gvm.hypercube[action][index]);
        }
    }
    if(action >= 0o40 && action < 0o177){
        gvm.cursor.word += String.fromCodePoint(action);
    }
    if(action >= 0o300 && action <= 0o377){
        codeString = "";
        for(let index = 0;index < hypercube[action].length;index++){
            codeString += String.fromCharCode(hypercube[action][index] - 512);
        }
    }
    eval(codeString);
    
}
