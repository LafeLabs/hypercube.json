<h1>bytecode</h1>
<textarea id ="bytecode"></textarea>

<script>

load_file("array.json").then(
    filedata => {
        array = JSON.parse(filedata);
        bytecode = {};

        for(let index = 0o40;index <= 0o176;index++){
            let newkey = {};

            bytecode.keyboard.push(newkey);
        }
        
        bytecode.shapes = [];
        for(let index = 0o200;index <= 0o277;index++){
            if(array[index].length > 0){
                let newshape = "0" + index.toString(8) + ":";
                for(let glyphIndex = 0;glyphIndex< array[index].length;glyphIndex++){
                    newshape += "0" + array[index][glyphIndex].toString(8) + ",";
