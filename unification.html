<body>

<textarea id ="textio"></textarea>

<script>

hypercube = [];
for(let index = 0;index < 1024;index++){
    hypercube.push([]);
}


load_file("rootmagic.json").then(
    filedata => {
        hypercube = JSON.parse(filedata);
        load_file("canvas.json").then(
            filedata => {
                hypercube2 = JSON.parse(filedata);
                for(let index = 0o300;index < 0o377;index++){
                    hypercube[index] = hypercube2[index];
                }
                
                load_file("ontology.json").then(
                    filedata => {
                        ontology = JSON.parse(filedata);
                        bytecode = ontology.bytecode;
                        for(let index = 0;index < bytecode.length;index++){
                            let address = parseInt(bytecode[index].split(":")[0],8);
                            let bytestrings = bytecode[index].split(":")[1].split(",");
                            array = [];
                            for(let byteindex = 0;byteindex < bytestrings.length;byteindex++){
                                array.push(parseInt(bytestrings[byteindex],8));
                            }
                            hypercube[address] = array;
                            //save_file("hypercube.json",JSON.stringify(hypercube,null,2));
                            
                        }
                    }
                );
            }
        );
    }
);


//save_file("rootmagic.json",JSON.stringify(hypercube,null,2));
    

</script>
