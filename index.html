<script>
mode = "mission";
icon = [];
inLine = false;
brushstroke = [];
thispoint = {};
thispoint.x = 0;
thispoint.y = 0;
address = 07;//mission

function invisible(){
    document.getElementById("mission").style.display = "none";
    document.getElementById("wall").style.display = "none";
    document.getElementById("feed").style.display = "none";
    document.getElementById("clear-feed").style.display = "none";
    document.getElementById("feed-post").style.display = "none";


    document.getElementById("qrcode").style.display = "none";
    document.getElementById("geometron-glyph-canvas").style.display = "none";
    document.getElementById("geometron-spell-canvas").style.display = "none";
    document.getElementById("icon").style.display = "none";    
    document.getElementById("maineditor").style.display = "none";    

    document.getElementById("delete-stroke").style.display = "none";    
    document.getElementById("clear-icon").style.display = "none";    
    
}
invisible();
document.getElementById("mission").style.display = "block";

codesquaresize = 100;
qrcode = new QRCode(document.getElementById("qrcode"), {
	text: window.location.href,
	width: codesquaresize,
	height: codesquaresize,
	colorDark : "#000000",
	colorLight : "#ffffff",
	correctLevel : QRCode.CorrectLevel.H
});

editor = ace.edit("maineditor");
editor.setTheme("ace/theme/github");
//editor.setTheme("ace/theme/vibrant_ink");
editor.getSession().setMode("ace/mode/javascript");
editor.getSession().setUseWrapMode(true);
editor.$blockScrolling = Infinity;
editor.setTheme("ace/theme/vibrant_ink");
editor.setOption("useWorker", false);

editor.setValue("code");

hypercube = [];
for(let index = 0;index < 1024;index++){
    hypercube.push([]);
}

load_file("mission.txt").then(
    filedata => {
        document.getElementById("mission").value = filedata;
    }
);

load_file("wall.txt").then(
    filedata => {
        document.getElementById("wall").value = filedata;
    }
);

feed = [];
load_file("feed.json").then(
    filedata => {
        feed = JSON.parse(filedata);
        loadFeed();
    }
);



document.getElementById("clear-feed").onclick = function(){

    feed = [];
    loadFeed();
    saveFeed();
    document.getElementById("feed-post").value = "";
    document.getElementById("feed-post").select();
    
}


document.getElementById("feed-post").onchange = function(){
    if(this.value.slice(-5) == ".html" || this.value.slice(0,8) == "https://" || this.value.slice(0,8) == "HTTPS://" || this.value.slice(0,7) == "http://"){
        post = "<a href = \"" + this.value + "\">" + this.value + "</a>";
    }
    else{
        post = this.value;
    }
    feed.unshift(post);
    this.value = "";
    loadFeed();
    saveFeed();
}



function loadFeed(){

    document.getElementById("feed").innerHTML = "";
    for(let index = 0;index < feed.length;index++){
        let newSign = document.createElement("DIV");
        newSign.id = "sign-" + index.toString();
        newSign.className = "sign";
        newSign.innerHTML = feed[index];
        let deleteButton = document.createElement("SPAN");
        deleteButton.className = "delete-button";
        deleteButton.innerHTML = "DELETE";
        deleteButton.onclick  = function(){
            let localIndex = parseInt(this.parentNode.id.split("-")[1]);
            let newFeed = [];
            for(let index = 0;index < feed.length;index++){
                if(index != localIndex){
                    newFeed.push(feed[index]);
                }
            }
            feed = newFeed;
            saveFeed();
            loadFeed();
        }
        newSign.appendChild(deleteButton);
        document.getElementById("feed").appendChild(newSign);
    }
}

function saveFeed(){
    data = encodeURIComponent(JSON.stringify(feed,null,"   "));
    save_file("feed.json",data);
}


document.getElementById("mission").onkeyup = function() {
    
    mission = this.value;
    data = encodeURIComponent(this.value);
    save_file("mission.txt",data);
    
}

document.getElementById("wall").onkeyup = function() {
    
    wall = this.value;
    data = encodeURIComponent(this.value);
    save_file("wall.txt",data);
    
}

function setup() {
 
  let container = document.getElementById('icon');
  
  if(innerWidth > innerHeight){
      p5jsquare = innerHeight - 160;
  }
  else{
      p5jsquare = innerWidth - 160;
  }
  let canvas = createCanvas(p5jsquare, p5jsquare);
  container.style.left = ((innerWidth - p5jsquare)/2).toString() + "px";
  canvas.parent('icon');
  noFill();
  background("#9f8767");
  //circle(width/2,height/2,250);
      stroke(0);
    strokeWeight(10);

    load_file("icon.json").then(
        filedata => {
            icon = JSON.parse(filedata);
            drawicon();
        }
    );
    
}


function draw() {
    if(mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height && mode == "icon"){
          if (mouseIsPressed === true) {
            if(inLine == false){
                var  point = {};
                point.x = Math.round(1000*mouseX/width);
                point.y = Math.round(1000*mouseY/width);
                brushstroke.push(point);
            }
            line(mouseX, mouseY, pmouseX, pmouseY);
            inLine = true;
            if(mouseX != pmouseX || mouseY != pmouseY){
                var  point = {};
                point.x = Math.round(1000*mouseX/width);
                point.y = Math.round(1000*mouseY/width);
                brushstroke.push(point);
            }
          }
          else{
              if(inLine){
                  icon.push(JSON.parse(JSON.stringify(brushstroke)));
                  data = encodeURIComponent(JSON.stringify(icon,null,3));
                  save_file("icon.json",data);
                  brushstroke = [];
              }
              inLine = false;
          }
      }
}

document.getElementById("clear-icon").onclick = function(){
    icon = [];
    drawicon();
    data = encodeURIComponent(JSON.stringify(icon,null,3));
    save_file("icon.json",data);
}

document.getElementById("delete-stroke").onclick = function(){
    icon.pop();
    drawicon();
    data = encodeURIComponent(JSON.stringify(icon,null,3));
    save_file("icon.json",data);
}

function drawicon(){
    clear();
    background("#9f8767");
    for(var strokeindex = 0;strokeindex < icon.length;strokeindex++){
        for(var pointindex = 1;pointindex < icon[strokeindex].length;pointindex++){
            
            line(0.001*width*icon[strokeindex][pointindex - 1].x,0.001*width*icon[strokeindex][pointindex - 1].y,0.001*width*icon[strokeindex][pointindex].x,0.001*width*icon[strokeindex][pointindex].y);
        }
    }
}


load_file("hypercube.json").then(
    filedata => {
        hypercube = JSON.parse(filedata);
        mainGVM = new GVM();
        mainGVM.canvas.width = 400;
        mainGVM.canvas.height = 400;
        mainGVM.canvas.x0 = 0.5 * mainGVM.canvas.width; 
        mainGVM.canvas.y0 = 0.5 * mainGVM.canvas.height;
        mainGVM.canvas.unit = 0.3 * mainGVM.canvas.width; 
        mainGVM.style.line0 = 3;
        mainGVM.hypercube = hypercube;
        mainGVM.glyph = [0o336,0o332,0o337,0o341,0o340,0o333,0o340,0o341,0o336,0o332,0o341,0o207];
        drawGlyph(document.getElementById("geometron-glyph-canvas"), mainGVM);
        mainGVM.style.line0 = 1;
        mainGVM.canvas.unit = 40;
        spellGlyph(document.getElementById("geometron-spell-canvas"), mainGVM);
        
    }
);


window.addEventListener('DOMContentLoaded', () => {
  const sixtyfoursSelect = document.querySelector('select[name="sixtyfours"]');
  const eightsSelect = document.querySelector('select[name="eights"]');
  const onesSelect = document.querySelector('select[name="ones"]');

  const modeSelect = document.querySelector('select[name="mode"]');

  sixtyfoursSelect.value = "0";
  eightsSelect.value = "0";
  onesSelect.value = "7";
  modeSelect.value = "mission";

  function handleChange() {
    const sixtyfours = parseInt(sixtyfoursSelect.value);
    const eights = parseInt(eightsSelect.value);
    const ones = parseInt(onesSelect.value);
    address =  64 * sixtyfours + (8 * eights) + ones;
    mode = modeSelect.value;
    if(mode == "wall"){
        invisible();
        document.getElementById("wall").style.display = "block";
    }
    if(mode == "mission"){
        invisible();
        document.getElementById("mission").style.display = "block";
    }
    if(mode == "icon"){
        invisible();
        document.getElementById("icon").style.display = "block";
        document.getElementById("delete-stroke").style.display = "block";  
        document.getElementById("clear-icon").style.display = "block";    
    }
    if(mode == "feed"){
        invisible();
        document.getElementById("feed").style.display = "block";
        document.getElementById("clear-feed").style.display = "inline";
        document.getElementById("feed-post").style.display = "inline";
        document.getElementById("feed-post").select();
    }
    if(mode == "javascript"){
        invisible();
          sixtyfoursSelect.value = "0";
          eightsSelect.value = "1";
          onesSelect.value = "0";
        const sixtyfours = parseInt(sixtyfoursSelect.value);
        const eights = parseInt(eightsSelect.value);
        const ones = parseInt(onesSelect.value);
        address =  64 * sixtyfours + (8 * eights) + ones;
        javascriptArray = hypercube[address];
        document.getElementById("maineditor").style.display = "block";
        document.getElementById("addresstable").style.display = "block";
        code = "";
        for(let index = 0;index < javascriptArray.length; index++){
            code += String.fromCharCode(javascriptArray[index] - 512);
        }
        editor.setValue(code);

    }


  }

  sixtyfoursSelect.addEventListener('change', handleChange);
  eightsSelect.addEventListener('change', handleChange);
  onesSelect.addEventListener('change', handleChange);
  modeSelect.addEventListener('change', handleChange); 
});


document.getElementById("maineditor").onkeyup = function(){
    data = editor.getSession().getValue();
    array = [];
    for(let index = 0;index < data.length;index++){
        action = data.charCodeAt(index);
        symbol = action + 512;
        array.push(symbol);
    }
    hypercube[address] = array;
    save_file("hypercube.json",JSON.stringify(hypercube,null,2));
    
}

</script>
