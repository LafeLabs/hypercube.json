function buildKeyboard(){
    for(let keyboardrow = 4;keyboardrow <= 15;keyboardrow++){
        let newtr = document.createElement("TR");
        for(let keyboardcol = 0;keyboardcol <= 0o7;keyboardcol++){
            if(!(keyboardrow == 15 && keyboardcol == 7)){
                let newtd = document.createElement("TD");
                newtd.innerHTML = "0" + (keyboardrow*8 + keyboardcol).toString(8) +  " [" + String.fromCharCode(keyboardrow*8 + keyboardcol) + "]:";
                let newinput = document.createElement("input");
                newinput.id = (keyboardrow*8 + keyboardcol).toString(8);
                newinput.onchange = function(){
                    let localaddress = parseInt(this.id,8);
                    let newkey = parseInt(this.value,8);
                    if (!isNaN(newkey) && newkey >= 0 && newkey <= 1023) {
                        hypercube[localaddress][0] = newkey;
                        
                        save_file("hypercube.json",JSON.stringify(hypercube));

                    }
                }
                newtd.appendChild(newinput);
                newinput.value =  "0" + (hypercube[keyboardrow*8 + keyboardcol][0]).toString(8);
                newtr.appendChild(newtd);
                
            }

        }
        document.getElementById("keyboard").appendChild(newtr);
        
    }
}

document.getElementById("feed-post").onchange = function(){
    if(this.value.slice(-5) == ".html" || this.value.slice(0,8) == "https://" || this.value.slice(0,8) == "HTTPS://" || this.value.slice(0,7) == "http://"){
        post = "<a href = \"" + this.value + "\">" + this.value + "</a>";
    }
    else{
        post = this.value;
    }
    feed.unshift(post);
    this.value = "";
    loadFeed();
    saveFeed();
}


function loadFeed(){

    document.getElementById("feed").innerHTML = "";
    for(let index = 0;index < feed.length;index++){
        let newSign = document.createElement("DIV");
        newSign.id = "sign-" + index.toString();
        newSign.className = "sign";
        newSign.innerHTML = feed[index];
        let deleteButton = document.createElement("SPAN");
        deleteButton.className = "delete-button";
        deleteButton.innerHTML = "DELETE";
        deleteButton.onclick  = function(){
            let localIndex = parseInt(this.parentNode.id.split("-")[1]);
            let newFeed = [];
            for(let index = 0;index < feed.length;index++){
                if(index != localIndex){
                    newFeed.push(feed[index]);
                }
            }
            feed = newFeed;
            saveFeed();
            loadFeed();
        }
        newSign.appendChild(deleteButton);
        document.getElementById("feed").appendChild(newSign);
    }
}

function saveFeed(){
    data = encodeURIComponent(JSON.stringify(feed,null,"   "));
    save_file("feed.json",data);

function draw() {
    if(mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height && mode == "icon"){
          if (mouseIsPressed === true) {
            if(inLine == false){
                var  point = {};
                point.x = Math.round(1000*mouseX/width);
                point.y = Math.round(1000*mouseY/width);
                brushstroke.push(point);
            }
            line(mouseX, mouseY, pmouseX, pmouseY);
            inLine = true;
            if(mouseX != pmouseX || mouseY != pmouseY){
                var  point = {};
                point.x = Math.round(1000*mouseX/width);
                point.y = Math.round(1000*mouseY/width);
                brushstroke.push(point);
            }
          }
          else{
              if(inLine){
                  icon.push(JSON.parse(JSON.stringify(brushstroke)));
                  data = encodeURIComponent(JSON.stringify(icon,null,3));
                  save_file("icon.json",data);
                  brushstroke = [];
              }
              inLine = false;
          }
      }
}

function drawicon(){
    clear();
    background("#9f8767");
    for(var strokeindex = 0;strokeindex < icon.length;strokeindex++){
        for(var pointindex = 1;pointindex < icon[strokeindex].length;pointindex++){
            
            line(0.001*width*icon[strokeindex][pointindex - 1].x,0.001*width*icon[strokeindex][pointindex - 1].y,0.001*width*icon[strokeindex][pointindex].x,0.001*width*icon[strokeindex][pointindex].y);
        }
    }
}

window.addEventListener('DOMContentLoaded', () => {
  const sixtyfoursSelect = document.querySelector('select[name="sixtyfours"]');
  const eightsSelect = document.querySelector('select[name="eights"]');
  const onesSelect = document.querySelector('select[name="ones"]');

  const modeSelect = document.querySelector('select[name="mode"]');

  sixtyfoursSelect.value = "0";
  eightsSelect.value = "1";
  onesSelect.value = "0";
  modeSelect.value = "mission";

  function handleChange() {
    sixtyfours = parseInt(sixtyfoursSelect.value);
    eights = parseInt(eightsSelect.value);
    ones = parseInt(onesSelect.value);
    address =  64 * sixtyfours + (8 * eights) + ones;
    mode = modeSelect.value;
    if(mode == "wall"){
        invisible();
        document.getElementById("wall").style.display = "block";
    }
    if(mode == "mission"){
        invisible();
        document.getElementById("mission").style.display = "block";
    }
    if(mode == "icon"){
        invisible();
        document.getElementById("icon").style.display = "block";
        document.getElementById("delete-stroke").style.display = "block";  
        document.getElementById("clear-icon").style.display = "block";    
    }
    if(mode == "feed"){
        invisible();
        document.getElementById("feed").style.display = "block";
        document.getElementById("clear-feed").style.display = "inline";
        document.getElementById("feed-post").style.display = "inline";
        document.getElementById("feed-post").select();
    }
    if(mode == "javascript"){
        invisible();
        if((address >= 0o10 && address <= 0o176) || (address >= 0o300 && address <= 0o377)){
            javascriptArray = hypercube[address];
            document.getElementById("maineditor").style.display = "block";
            document.getElementById("addresstable").style.display = "block";
            code = "";
            for(let index = 0;index < javascriptArray.length; index++){
                code += String.fromCharCode(javascriptArray[index] - 512);
            }
            editor.setValue(code);
        }
        else{
            address = 0o10;
            sixtyfours = Math.floor(address / 64) % 8;
            eights     = Math.floor(address / 8) % 8;
            ones       = address % 8;
            
            sixtyfoursSelect.value = sixtyfours.toString();
            eightsSelect.value = eights.toString();
            onesSelect.value = ones.toString();
    
            javascriptArray = hypercube[address];
            document.getElementById("maineditor").style.display = "block";
            document.getElementById("addresstable").style.display = "block";
            code = "";
            for(let index = 0;index < javascriptArray.length; index++){
                code += String.fromCharCode(javascriptArray[index] - 512);
            }
            editor.setValue(code);
            
        }

    }
    if(mode == "keyboard"){
        invisible();
        document.getElementById("keyboard").style.display = "block";
    }
    if(mode == "qrcode"){
        invisible();
        document.getElementById("qrcode-box").style.display = "block";
        document.body.style.backgroundColor = "white";
    }
    else{
        document.body.style.backgroundColor = "#9f8767";
    }
    if(mode == "geometron"){
        
        invisible();
        document.getElementById("geometron-glyph-canvas").style.display = "block";
        document.getElementById("geometron-spell-canvas").style.display = "block";    
        document.getElementById("geometron-glyph-input").style.display = "block"; 

        document.getElementById("addresstable").style.display = "block"; 
        
        for(let index = 0o277;index >= 0o220; index--){
            if(mainGVM.hypercube[index].length > 0){
                mainGVM.address = index;
                address = index;
                break;
            }
        }
        sixtyfours = Math.floor(address / 64) % 8;
        eights     = Math.floor(address / 8) % 8;
        ones       = address % 8;
        
        sixtyfoursSelect.value = sixtyfours.toString();
        eightsSelect.value = eights.toString();
        onesSelect.value = ones.toString();
        mainGVM.glyph = hypercube[address];
        mainGVM.glyph.push(0o207);
        spellGVM.glyph = mainGVM.glyph;
        spellGVM.address = mainGVM.address;
        
        drawGlyph(geometronGlyphCanvas, mainGVM);
        spellGlyph(geometronSpellCanvas, spellGVM);

    }


  }

  sixtyfoursSelect.addEventListener('change', handleChange);
  eightsSelect.addEventListener('change', handleChange);
  onesSelect.addEventListener('change', handleChange);
  modeSelect.addEventListener('change', handleChange); 
});

function keyPressed() {
    if(mode == "geometron" && document.activeElement != document.getElementById("geometron-glyph-input")){

        let actionKey = null;
        if (key.length === 1) {
            actionKey = key.charCodeAt(0);
        } else {
            // Map special keys to unique integers below 32
            if (keyCode === BACKSPACE) actionKey = 0o10;  
            if (keyCode === ENTER)     actionKey = 0o12; 
            if (keyCode === LEFT_ARROW)  actionKey = 0o20;  
            if (keyCode === RIGHT_ARROW) actionKey = 0o21;  
            if (keyCode === UP_ARROW)    actionKey = 0o22;  
            if (keyCode === DOWN_ARROW)  actionKey = 0o23;
        }
        
        if(actionKey >= 0o40 && actionKey < 0o177){
            
            if(mainGVM.keyboard.mode === 0){
                if(mainGVM.hypercube[actionKey][0] < 0o40){
                    rootMagic(mainGVM,mainGVM.hypercube[actionKey][0]);
                } else{
                    let oldGlyph = mainGVM.glyph;
                    mainGVM.glyph = [];
                    for(let glyphIndex = 0;glyphIndex < oldGlyph.length;glyphIndex++){
                        if(oldGlyph[glyphIndex] != 0o207){
                            mainGVM.glyph.push(oldGlyph[glyphIndex]);
                        } else{
                                mainGVM.glyph.push(mainGVM.hypercube[actionKey][0]);
                                mainGVM.glyph.push(0o207);
                        }
                    }
                }            
            }
            if(mainGVM.keyboard.mode === 1){
                let oldGlyph = mainGVM.glyph;
                mainGVM.glyph = [];
                for(let glyphIndex = 0;glyphIndex < oldGlyph.length;glyphIndex++){
                    if(oldGlyph[glyphIndex] != 0o207){
                        mainGVM.glyph.push(oldGlyph[glyphIndex]);
                    } else{
                        mainGVM.glyph.push(actionKey + 0o1000);
                        mainGVM.glyph.push(0o207);
                    }
                }
            }
            if(mainGVM.keyboard.mode === 2){
                let oldGlyph = mainGVM.glyph;
                mainGVM.glyph = [];
                for(let glyphIndex = 0;glyphIndex < oldGlyph.length;glyphIndex++){
                    if(oldGlyph[glyphIndex] != 0o207){
                        mainGVM.glyph.push(oldGlyph[glyphIndex]);
                    } else{
                        mainGVM.glyph.push(actionKey);
                        mainGVM.glyph.push(0o207);
                    }
                }
            }
        }
        if (actionKey === 0o10) {
            //delete character before the cursor
            rootMagic(mainGVM,0o10);
        }
        if (actionKey === 0o12) {
            rootMagic(mainGVM,0o12);
    
            //ENTER key
            //mode switch from shape to font to word        
        }
        if (actionKey === 0o20) {
            //0o20 left arrow, cursor back
            rootMagic(mainGVM,0o20);
        }
        if (actionKey === 0o21) {
            //right arrow, cursor forward
            rootMagic(mainGVM,0o21);
        }
        if (actionKey === 0o22) {
            //up arrow, move up in hypercube
            rootMagic(mainGVM,0o22);
            mainGVM.canvas.x0 = 0.5 * mainGVM.canvas.width; 
            mainGVM.canvas.y0 = 0.5 * mainGVM.canvas.height;
            mainGVM.canvas.unit = 0.3 * mainGVM.canvas.width; 

            
        }
        if (actionKey === 0o23) {
            //down arrow,move down in hypercube
            rootMagic(mainGVM,0o23);
            mainGVM.canvas.x0 = 0.5 * mainGVM.canvas.width; 
            mainGVM.canvas.y0 = 0.5 * mainGVM.canvas.height;
            mainGVM.canvas.unit = 0.3 * mainGVM.canvas.width; 

        }
        

        mainGVM.glyph = mainGVM.glyph.filter(item => item !== null);

        spellGVM.glyph = mainGVM.glyph; 
        
        drawGlyph(geometronGlyphCanvas, mainGVM);
        spellGlyph(geometronSpellCanvas, spellGVM);
        
//        saveHypercube(mainGVM);
        mainGVM.hypercube[mainGVM.address] = mainGVM.glyph.filter(cursorCode => cursorCode !== 0o207);
        
        hypercube[mainGVM.address] =  mainGVM.hypercube[mainGVM.address];
        save_file("hypercube.json",JSON.stringify(hypercube));
        
        
        let glyphString = "";
        for(let index = 0;index < mainGVM.glyph.length;index++){
            if(mainGVM.glyph[index] != 0o207 && mainGVM.glyph[index] != null){
                glyphString += "0" + mainGVM.glyph[index].toString(8) + ",";
            }
        }
        document.getElementById("geometron-glyph-input").value = glyphString;
    }
}
